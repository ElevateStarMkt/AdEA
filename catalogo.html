<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico">
    <title>Catálogo - AdEA</title>
    <meta
      name="description"
      content="Explora más de 20 libros curados por emoción. Filtra por género, mood y popularidad. Tu próxima lectura te está esperando."
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      .catalog-hero {
        padding: 120px 0 48px;
      }
      .catalog-hero__title {
        margin-bottom: 12px;
      }
      .catalog-hero__inner {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 24px;
        flex-wrap: wrap;
      }
      .results-info {
        font-size: 0.85rem;
        color: var(--text-dim);
        margin-bottom: 24px;
      }
      .results-info strong {
        color: var(--text);
      }
      .no-results {
        grid-column: 1 / -1;
        text-align: center;
        padding: 80px 24px;
        color: var(--text-muted);
      }
      .no-results span {
        font-size: 3rem;
        display: block;
        margin-bottom: 16px;
      }
      .active-filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 24px;
      }
      .filter-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--red-glow);
        border: 1px solid rgba(200, 16, 46, 0.3);
        color: #ff4d6d;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
      }
      .filter-tag::after {
        content: "×";
        font-size: 1rem;
      }
      /* PAGINACIÓN */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 40px;
        flex-wrap: wrap;
      }
      .pagination__btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--bg2);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pagination__btn:hover,
      .pagination__btn.active {
        background: var(--red);
        border-color: var(--red);
        color: var(--white);
        transform: translateY(-2px);
      }
      .pagination__btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .pagination__info {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin: 0 12px;
        min-width: 100px;
        text-align: center;
      }
      @media (max-width: 768px) {
        .pagination__btn {
          width: 36px;
          height: 36px;
          font-size: 0.85rem;
        }
        .pagination__info {
          font-size: 0.8rem;
          margin: 0 8px;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>

    <section class="catalog-hero">
      <div class="container">
        <div class="catalog-hero__inner">
          <div>
            <span class="section-header__label">Todos los libros</span>
            <h1 class="catalog-hero__title">Catálogo completo</h1>
            <p>
              Filtra por género, mood o búsqueda libre. Sin algoritmos raros.
            </p>
          </div>
          <div class="search-wrap">
            <svg
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Buscar título o autor…"
            />
          </div>
        </div>
      </div>
    </section>

    <div class="divider"></div>

    <section class="section-sm">
      <div class="container">
        <!-- FILTERS -->
        <div class="filters fade-in">
          <div class="filters__row">
            <div class="filter-group">
              <label>Género</label>
              <select id="filter-genero">
                <option value="">Todos los géneros</option>
                <option value="romance">Romance</option>
                <option value="thriller">Thriller</option>
                <option value="fantasia">Fantasía</option>
                <option value="ficción">Ficción</option>
                <option value="histórica">Histórica</option>
                <option value="drama">Drama</option>
                <option value="literaria">Literaria</option>
                <option value="poesia">Poesía</option>
                <option value="ciencia ficción">Ciencia ficción</option>
                <option value="terror">Terror</option>
                <option value="young-adult">Young Adult</option>
                <option value="misterio">Misterio</option>
                <option value="erotica">Erótica</option>
                <option value="policiaca">Policíaca</option>
                <option value="distopia">Distopía</option>                
              </select>
            </div>
            <div class="filter-group">
              <label>Mood</label>
              <select id="filter-mood">
                <option value="">Todos los moods</option>
                <option value="adictivo">⚡ Adictivo</option>
                <option value="devastador">💔 Devastador</option>
                <option value="spicy">🌶️ Spicy</option>
                <option value="reflexivo">💭 Reflexivo</option>
                <option value="épico">🐉 Épico</option>
                <option value="oscuro">🖤 Oscuro</option>
                <option value="ligero">☀️ Ligero</option>
                <option value="emotivo">😭 Emotivo</option>
                <option value="esperanzador">🌟 Esperanzador</option>
                <option value="melancólico">🌧️ Melancólico</option>
                <option value="nostalgico">🕰️ Nostálgico</option>
                <option value="divertido">😄 Divertido</option>
                <option value="intrigante">🔍 Intrigante</option>
                <option value="reconfortante">🫂 Reconfortante</option>                
              </select>
            </div>
            <div class="filter-group">
              <label>Ordenar por</label>
              <select id="filter-order">
                <option value="default">Orden predeterminado</option>
                <option value="valoracion">Solo por valoración</option>
                <option value="titulo">Alfabético</option>
                <option value="nuevos">Más nuevos primero</option>
              </select>
            </div>
            <div>
              <button
                class="btn btn-ghost"
                id="btn-reset"
                style="margin-top: 24px"
              >
                ↺ Limpiar filtros
              </button>
            </div>
          </div>
        </div>

        <!-- MOOD PILLS -->
        <div
          class="mood-pills fade-in"
          style="margin-bottom: 32px"
          id="mood-pills"
        >
          <button class="mood-pill active" data-mood="">Todos</button>
          <button class="mood-pill" data-mood="adictivo">⚡ Adictivo</button>
          <button class="mood-pill" data-mood="devastador">
            💔 Devastador
          </button>
          <button class="mood-pill" data-mood="spicy">🌶️ Spicy</button>
          <button class="mood-pill" data-mood="reflexivo">💭 Reflexivo</button>
          <button class="mood-pill" data-mood="épico">🐉 Épico</button>
          <button class="mood-pill" data-mood="oscuro">🖤 Oscuro</button>
          <button class="mood-pill" data-mood="ligero">☀️ Ligero</button>
          <button class="mood-pill" data-mood="emotivo">😭 Emotivo</button>
          <button class="mood-pill" data-mood="esperanzador">🌟 Esperanzador</button>
          <button class="mood-pill" data-mood="melancolico">🌧️ Melancólico</button>
          <button class="mood-pill" data-mood="nostalgico">🕰️ Nostálgico</button>
          <button class="mood-pill" data-mood="divertido">😄 Divertido</button>
          <button class="mood-pill" data-mood="intrigante">🔍 Intrigante</button>
          <button class="mood-pill" data-mood="reconfortante">🫂 Reconfortante</button>
        </div>

        <!-- ACTIVE FILTERS -->
        <div class="active-filters" id="active-filters"></div>

        <!-- RESULTS INFO -->
        <p class="results-info" id="results-info"></p>

        <!-- GRID -->
        <div class="books-grid" id="catalog-grid"></div>
        
        <!-- PAGINACIÓN -->
        <div class="pagination" id="pagination" style="display: none">
          <button class="pagination__btn" id="prev-page" disabled>←</button>
          <span class="pagination__info" id="page-info">Página 1</span>
          <button class="pagination__btn" id="next-page">→</button>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script>
      injectShell("");

      let allBooks = [];
      let activeGenero = "";
      let activeMood = "";
      let activeOrder = "default";
      let searchQuery = "";
      let filterByEscritorId = null;
      
      // Paginación
      const BOOKS_PER_PAGE = 36;
      let currentPage = 1;
      let filteredBooks = [];

      // ---- Calcular promedio de reseñas ----
      function calcularRatingDesdeResenas(reviews) {
        if (!reviews?.length) return null;
        const sum = reviews.reduce((acc, r) => acc + (r.estrellas || 0), 0);
        return Math.round((sum / reviews.length) * 10) / 10;
      }

      function getTopEtiquetasDesdeResenas(reviews, limit = 2) {
        if (!reviews?.length) return [];
        const freq = {};
        reviews.forEach((r) => {
          if (r.etiqueta) freq[r.etiqueta] = (freq[r.etiqueta] || 0) + 1;
        });
        return Object.entries(freq)
          .sort((a, b) => b[1] - a[1])
          .slice(0, limit)
          .map(([tag]) => tag);
      }

      async function enriquecerLibrosConResenas(libros) {
        if (typeof getResenasPorLibro !== "function") return libros;
        const enriched = await Promise.all(
          libros.map(async (book) => {
            try {
              const reviews = await getResenasPorLibro(book.id);
              const avgRating = calcularRatingDesdeResenas(reviews);
              const topTags = getTopEtiquetasDesdeResenas(reviews, 2);
              return {
                ...book,
                valoracion_review: avgRating,
                topEtiquetas: topTags,
                valoracion: avgRating !== null ? avgRating : book.valoracion,
              };
            } catch (e) {
              return book;
            }
          }),
        );
        return enriched;
      }

      // ---- Ordenamiento MULTICRITERIO predeterminado ----
      function sortBooksDefault(a, b) {
        // 1. Destacado primero
        if ((a.destacado ? 1 : 0) !== (b.destacado ? 1 : 0)) {
          return (b.destacado ? 1 : 0) - (a.destacado ? 1 : 0);
        }
        // 2. Mejor valoración
        const ratingA = a.valoracion_review || a.valoracion || 0;
        const ratingB = b.valoracion_review || b.valoracion || 0;
        if (ratingA !== ratingB) {
          return ratingB - ratingA;
        }
        // 3. Más nuevo (libroId más alto = más reciente)
        if (a.libroId !== b.libroId) {
          return b.libroId - a.libroId;
        }
        // 4. Alfabético por título
        return (a.titulo || "").localeCompare(b.titulo || "");
      }

      // ---- Filtros y ordenamiento ----
      function applyFilters() {
        let books = [...allBooks];

        // Filtro por escritor (desde URL)
        if (filterByEscritorId) {
          books = books.filter((b) => b.escritorId === filterByEscritorId);
        }

        // Solo libros activos
        books = books.filter((b) => b.activo !== false);

        // Búsqueda por texto
        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          books = books.filter(
            (b) =>
              (b.titulo || "").toLowerCase().includes(q) ||
              (b.autor || "").toLowerCase().includes(q) ||
              (b.sinopsis_corta || "").toLowerCase().includes(q),
          );
        }

        // Filtro por género
        if (activeGenero)
          books = books.filter((b) => (b.genero || []).includes(activeGenero));

        // Filtro por mood
        if (activeMood)
          books = books.filter((b) => (b.mood || []).includes(activeMood));

        // Ordenamiento
        if (activeOrder === "default") {
          books.sort(sortBooksDefault);
        } else if (activeOrder === "valoracion") {
          books.sort((a, b) => {
            const ratingA = a.valoracion_review || a.valoracion || 0;
            const ratingB = b.valoracion_review || b.valoracion || 0;
            return ratingB - ratingA;
          });
        } else if (activeOrder === "titulo") {
          books.sort((a, b) => (a.titulo || "").localeCompare(b.titulo || ""));
        } else if (activeOrder === "nuevos") {
          books.sort((a, b) => b.libroId - a.libroId);
        }

        // Guardar para paginación
        filteredBooks = books;
        currentPage = 1;
        
        renderGrid();
        renderResultsInfo();
        renderActiveFilters();
        renderPagination();
      }

      function renderGrid() {
        const grid = document.getElementById("catalog-grid");
        if (!filteredBooks.length) {
          grid.innerHTML = `<div class="no-results"><span>📚</span><p>No encontramos libros con esos filtros.<br>Prueba combinando de otra forma.</p></div>`;
          return;
        }
        
        // Paginación: calcular rango
        const start = (currentPage - 1) * BOOKS_PER_PAGE;
        const end = start + BOOKS_PER_PAGE;
        const pageBooks = filteredBooks.slice(start, end);
        
        grid.innerHTML = pageBooks.map((b) => buildBookCard(b, "")).join("");
        initFadeIn();
      }

      function renderResultsInfo() {
        const total = filteredBooks.length;
        const start = Math.min((currentPage - 1) * BOOKS_PER_PAGE + 1, total);
        const end = Math.min(currentPage * BOOKS_PER_PAGE, total);
        
        if (total === 0) {
          document.getElementById("results-info").innerHTML = 
            "No hay libros que coincidan con los filtros";
        } else {
          document.getElementById("results-info").innerHTML = 
            `Mostrando <strong>${start}-${end}</strong> de <strong>${total}</strong> libro${total !== 1 ? "s" : ""}`;
        }
      }

      function renderActiveFilters() {
        const wrap = document.getElementById("active-filters");
        const tags = [];
        if (filterByEscritorId)
          tags.push(`autor: ${filterByEscritorId.substring(0, 8)}...`);
        if (activeMood) tags.push(`mood: ${activeMood}`);
        if (activeGenero) tags.push(`género: ${activeGenero}`);
        if (searchQuery) tags.push(`búsqueda: "${searchQuery}"`);
        wrap.innerHTML = tags
          .map(
            (t) =>
              `<span class="filter-tag" onclick="clearAllFilters()">${t}</span>`,
          )
          .join("");
      }

      function clearAllFilters() {
        filterByEscritorId = null;
        activeGenero = "";
        activeMood = "";
        searchQuery = "";
        activeOrder = "default";
        document.getElementById("filter-genero").value = "";
        document.getElementById("filter-mood").value = "";
        document.getElementById("filter-order").value = "default";
        document.getElementById("search-input").value = "";
        document
          .querySelectorAll(".mood-pill")
          .forEach((p) => p.classList.remove("active"));
        document
          .querySelector('.mood-pill[data-mood=""]')
          .classList.add("active");
        applyFilters();
      }

      // ---- Paginación ----
      function renderPagination() {
        const pagination = document.getElementById("pagination");
        const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
        
        if (totalPages <= 1) {
          pagination.style.display = "none";
          return;
        }
        
        pagination.style.display = "flex";
        document.getElementById("page-info").textContent = 
          `Página ${currentPage} de ${totalPages}`;
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled = currentPage === totalPages;
      }

      function changePage(direction) {
        const totalPages = Math.ceil(filteredBooks.length / BOOKS_PER_PAGE);
        const newPage = currentPage + direction;
        
        if (newPage < 1 || newPage > totalPages) return;
        
        currentPage = newPage;
        renderGrid();
        renderResultsInfo();
        renderPagination();
        
        // Scroll suave hacia el grid
        const grid = document.getElementById("catalog-grid");
        if (grid) {
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      // ---- Init ----
      document.addEventListener("DOMContentLoaded", async () => {
        allBooks = await loadBooks();
        allBooks = await enriquecerLibrosConResenas(allBooks);

        // Leer parámetros de URL
        const params = new URLSearchParams(location.search);
        const escritorId = params.get("escritorId");
        if (escritorId) {
          filterByEscritorId = escritorId;
        }
        if (params.get("mood")) {
          activeMood = params.get("mood");
          document.getElementById("filter-mood").value = activeMood;
        }
        if (params.get("genero")) {
          activeGenero = params.get("genero");
          document.getElementById("filter-genero").value = activeGenero;
        }

        // Mood pills
        document.querySelectorAll(".mood-pill").forEach((btn) => {
          // Normalizar para comparación (sin tildes en data-mood)
          const btnMood = btn.dataset.mood;
          const activeMoodNormalized = activeMood?.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const btnMoodNormalized = btnMood?.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          
          if (btnMoodNormalized === activeMoodNormalized) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }
          
          btn.addEventListener("click", () => {
            activeMood = btn.dataset.mood;
            document
              .querySelectorAll(".mood-pill")
              .forEach((p) => p.classList.remove("active"));
            btn.classList.add("active");
            document.getElementById("filter-mood").value = activeMood;
            applyFilters();
          });
        });

        // Filtros select
        document
          .getElementById("filter-genero")
          .addEventListener("change", (e) => {
            activeGenero = e.target.value;
            applyFilters();
          });
        document
          .getElementById("filter-mood")
          .addEventListener("change", (e) => {
            activeMood = e.target.value;
            document
              .querySelectorAll(".mood-pill")
              .forEach((p) => p.classList.remove("active"));
            const match = document.querySelector(
              `.mood-pill[data-mood="${activeMood}"]`,
            );
            if (match) match.classList.add("active");
            else
              document
                .querySelector('.mood-pill[data-mood=""]')
                .classList.add("active");
            applyFilters();
          });
        document
          .getElementById("filter-order")
          .addEventListener("change", (e) => {
            activeOrder = e.target.value;
            applyFilters();
          });
        document
          .getElementById("btn-reset")
          .addEventListener("click", clearAllFilters);

        // Paginación
        document.getElementById("prev-page").addEventListener("click", () => changePage(-1));
        document.getElementById("next-page").addEventListener("click", () => changePage(1));

        // Búsqueda con debounce
        let searchTimer;
        document
          .getElementById("search-input")
          .addEventListener("input", (e) => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
              searchQuery = e.target.value.trim();
              applyFilters();
            }, 300);
          });

        applyFilters();
      });
    </script>
  </body>
</html>
