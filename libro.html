<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico" />
    <title id="page-title">Libro - AdEA</title>
    <meta
      name="description"
      id="page-desc"
      content="Descubre este libro en AdEA"
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      .book-hero {
        padding: 120px 0 80px;
      }
      .book-hero__inner {
        display: grid;
        grid-template-columns: 280px 1fr;
        gap: 64px;
        align-items: start;
      }
      .book-cover-wrap {
        position: sticky;
        top: 88px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .book-cover {
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
        aspect-ratio: 2/3;
        background: var(--bg3);
      }
      .book-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .book-info__back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.82rem;
        color: var(--text-dim);
        margin-bottom: 24px;
        transition: color var(--transition);
      }
      .book-info__back:hover {
        color: var(--text);
      }
      .book-info__generos {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 20px;
      }
      .book-info__title {
        font-size: clamp(1.8rem, 4vw, 3rem);
        margin-bottom: 8px;
      }
      .book-info__author {
        font-size: 1.1rem;
        color: var(--text-muted);
        margin-bottom: 20px;
      }
      .book-info__rating {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .book-info__rating .stars {
        font-size: 1.1rem;
        color: var(--gold);
      }
      .book-info__rating span {
        font-size: 0.9rem;
        color: var(--text-muted);
      }
      .book-info__sinopsis {
        font-size: 1rem;
        line-height: 1.8;
        color: var(--text-muted);
        margin-bottom: 32px;
        max-width: 600px;
      }
      .book-info__tags {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 36px;
      }
      .book-info__tag {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 6px 14px;
        font-size: 0.82rem;
        color: var(--text-muted);
        font-weight: 500;
      }
      .buy-box {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 28px;
        margin-bottom: 32px;
      }
      .buy-box__label {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--text-dim);
        margin-bottom: 12px;
      }
      .buy-box__main {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .buy-box__btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .affiliate-note {
        font-size: 0.72rem;
        color: var(--text-dim);
        text-align: center;
        line-height: 1.5;
      }
      .related {
        padding: 80px 0;
      }
      .skeleton-book {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        overflow: hidden;
      }
      .skeleton-cover {
        aspect-ratio: 2/3;
      }
      .skeleton-body {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .skeleton-line {
        height: 14px;
        border-radius: 4px;
      }

      /* RESEÑAS */
      .reviews-section {
        margin-top: 48px;
        padding-top: 32px;
        border-top: 1px solid var(--border);
      }
      .reviews-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        margin-bottom: 24px;
      }
      .reviews-title {
        font-family: var(--font-serif);
        font-size: 1.3rem;
        margin: 0;
      }
      .reviews-filters {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        align-items: center;
      }
      .review-filter {
        display: flex;
        align-items: center;
        gap: 6px;
        background: var(--bg3);
        border: 1px solid var(--border);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.75rem;
        cursor: pointer;
        transition: all var(--transition);
        color: var(--white);
      }
      .review-filter:hover,
      .review-filter.active {
        border-color: var(--red);
        background: var(--red-glow);
      }
      .review-filter .count {
        color: var(--text-dim);
        font-weight: 600;
      }
      .review-filter.active .count {
        color: var(--white);
      }
      .review-filter.stars-filter {
        color: var(--gold);
      }

      .review-card {
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: border-color var(--transition);
      }
      .review-card:hover {
        border-color: var(--red);
      }
      .review-card__header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 8px;
      }
      .review-card__author {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .review-card__avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.9rem;
        color: var(--text);
        flex-shrink: 0;
      }
      .review-card__name {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
      }
      .review-card__stars {
        color: var(--gold);
        font-size: 0.9rem;
        letter-spacing: 1px;
      }
      .review-card__mood {
        font-size: 0.75rem;
        color: var(--text-muted);
        background: var(--surface);
        padding: 2px 8px;
        border-radius: 12px;
      }
      .review-card__text {
        font-size: 0.9rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin-bottom: 8px;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .review-card__text.expanded {
        -webkit-line-clamp: unset;
      }
      .review-card__tag {
        display: inline-block;
        background: var(--surface);
        padding: 3px 10px;
        border-radius: 16px;
        font-size: 0.7rem;
        color: var(--text-muted);
        margin-top: 4px;
      }
      .review-card__actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .review-card__actions-left,
      .review-card__actions-right {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .review-card__btn {
        background: none;
        border: none;
        color: var(--text-dim);
        font-size: 0.75rem;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .review-card__btn:hover {
        color: var(--text);
        background: var(--surface);
      }
      .review-card__btn.delete:hover {
        color: #f87171;
        background: rgba(239, 68, 68, 0.1);
      }
      .review-card__btn.edit:hover {
        color: #60a5fa;
        background: rgba(96, 165, 250, 0.1);
      }
      .review-card__btn.helpful.active {
        color: #4ade80;
      }
      .review-card__btn.not-helpful.active {
        color: #f87171;
      }
      .review-card__helpful-count {
        font-size: 0.7rem;
        color: var(--text-dim);
        margin-left: 4px;
      }

      .reviews-pagination {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 24px;
      }
      .review-page-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg3);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all var(--transition);
      }
      .review-page-btn:hover,
      .review-page-btn.active {
        background: var(--red);
        border-color: var(--red);
        color: var(--white);
      }
      .review-page-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        padding: 28px;
        position: relative;
        animation: modalIn 0.25s ease;
        overflow-y: auto;
        margin: auto;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal__close {
        position: sticky;
        top: -8px;
        float: right;
        background: var(--surface);
        border: none;
        color: var(--text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition);
        z-index: 10;
      }
      .modal__close:hover {
        color: var(--red);
        background: var(--bg3);
      }
      .modal__title {
        font-family: var(--font-serif);
        font-size: 1.3rem;
        margin-bottom: 20px;
      }
      .modal__form .form-group {
        margin-bottom: 16px;
      }
      .modal__form label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-dim);
        display: block;
        margin-bottom: 6px;
      }
      .modal__form input,
      .modal__form select,
      .modal__form textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 0.9rem;
        font-family: var(--font-sans);
      }
      .modal__form input:focus,
      .modal__form select:focus,
      .modal__form textarea:focus {
        outline: none;
        border-color: var(--red);
        background: var(--bg3);
      }
      .modal__form textarea {
        min-height: 100px;
        resize: vertical;
      }
      .modal__form .rating-input {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .modal__form .rating-input input {
        width: 80px;
        text-align: center;
        font-size: 1.1rem;
        font-weight: 700;
      }
      .modal__form .rating-hint {
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-top: 4px;
      }
      .modal__actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
      }
      .modal__actions .btn {
        flex: 1;
        justify-content: center;
      }

      .expandable-form {
        margin-top: 24px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 20px;
        display: none;
      }
      .expandable-form.show {
        display: block;
        animation: slideDown 0.25s ease;
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 768px) {
        .book-hero__inner {
          grid-template-columns: 1fr;
        }
        .book-cover-wrap {
          position: static;
          flex-direction: row;
          align-items: flex-start;
          gap: 20px;
          justify-content: center;
        }
        .book-cover {
          width: 120px;
          flex-shrink: 0;
        }
        .book-info__generos {
          display: flex;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 3%;
          justify-content: center;
          margin-top: -12%;
        }
        .book-info__tags {
          display: grid;
          flex-wrap: wrap;
          gap: 8px;
          margin-bottom: 36px;
          justify-content: center;
          grid-template-columns: 50% 50%;
        }
        .book-cover img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .book-info__rating {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 28px;
          padding-top: 3%;
          justify-content: center;
        }
        .reviews-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .reviews-filters {
          width: 100%;
          overflow-x: auto;
          padding-bottom: 8px;
        }
        .modal {
          max-height: 85vh;
          padding: 20px;
        }
        .modal__actions {
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>

    <section class="book-hero">
      <div class="container">
        <div class="book-hero__inner" id="book-content">
          <!-- Loading skeleton -->
          <div class="book-cover-wrap">

              <div class="skeleton-cover skeleton"></div>

          <div>

            ></div>

            <div

            ></div>

              style="height: 14px; width: 100%; margin-bottom: 8px"

    <div class="divider"></div>
    <br />
    <!-- Buscar la sección .book-info__tags y añadir después -->
    <div
      class="book-info__actions"

    <section class="related">
      <div class="container">
        <div class="section-header">
          <span class="section-header__label">Te puede gustar</span>

        </div>

      </div>

    <!-- RESEÑAS -->
    <section class="section-sm" style="border-top: 1px solid var(--border)">
      <div class="container">
        <div class="reviews-section">
          <div class="reviews-header">
            <h3 class="reviews-title">Reseñas de lectores</h3>
            <div class="reviews-filters" id="reviews-filters"></div>
          </div>
          <div id="reviews-list"></div>
          <div class="reviews-pagination" id="reviews-pagination"></div>
          <div style="margin-top: 24px">
            <button class="btn btn-secondary" id="btn-add-resena">
              Escribir reseña
            </button>
          </div>
          <div class="expandable-form" id="expandable-resena-form">
            <form id="inline-resena-form">
              <input type="hidden" id="resena-edit-id" />
              <div class="form-group">
                <label>Tu valoración (0-5) *</label>
                <div class="rating-input">
                  <input
                    type="text"
                    id="resena-rating"
                    placeholder="4.5"
                    maxlength="3"
                    required
                  />

                </div>

                  <option value="ligero">☀️ Ligero</option>

                  <option value="esperanzador">🌟 Esperanzador</option>
                  <option value="melancólico">🌧️ Melancólico</option>
                  <option value="nostalgico">🕰️ Nostálgico</option>
                  <option value="divertido">😄 Divertido</option>

                  <option value="reconfortante">🫂 Reconfortante</option>

                  <option value="enemies-to-lovers">

                  <option value="aburrido">😴 Aburrido</option>

              </div>
              <div class="form-group">

                  Cancelar

              </div>

    <!-- MODAL SOLICITUD COLABORACIÓN -->
    <div id="collab-modal" class="modal-overlay" style="display: none">
      <div class="modal">
        <button class="modal__close" onclick="closeCollabModal()">×</button>
        <h3 class="modal__title" id="collab-modal-title">
          Solicitar colaboración
        </h3>
        <form id="collab-form">
          <input type="hidden" id="collab-tipo" />
          <input type="hidden" id="collab-libroId" />
          <input type="hidden" id="collab-destinatarioId" />

          <!-- Campos dinámicos -->
          <div id="collab-fields"></div>

          <div class="form-group">
            <label>Mensaje</label>
            <textarea
              id="collab-mensaje"
              placeholder="Cuéntale por qué te gustaría colaborar..."
              style="min-height: 100px"
            ></textarea>
          </div>

          <div
            style="
              background: var(--bg3);
              padding: 12px 16px;
              border-radius: var(--radius);
              margin: 16px 0;
              font-size: 0.8rem;
              color: var(--text-muted);
            "
            id="collab-note"
          >
            <!-- Nota sobre coste -->
          </div>

          <div class="modal__actions">
            <button
              type="submit"
              class="btn btn-primary"
              id="btn-submit-collab"
            >
              Enviar solicitud
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              onclick="closeCollabModal()"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/libro.js"></script>
  </body>
</html>
