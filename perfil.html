<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico" />
    <title>Perfil - AdEA</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      /* (Se mantiene todo el CSS original de perfil.html) */
      .profile-hero {
        padding: 8% 0 8%;
      }
      .profile-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 32px;
        max-width: 100%;
        margin: 0 auto;
      }
      .profile-header {
        display: flex;
        align-items: center;
        gap: 24px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .profile-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: var(--red);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        font-weight: 700;
        flex-shrink: 0;
      }
      .profile-name {
        font-family: var(--font-serif);
        font-size: 1.4rem;
        margin-bottom: 4px;
      }
      .profile-rol {
        font-size: 0.8rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .profile-stats {
        display: flex;
        gap: 24px;
        margin-bottom: 24px;
      }
      .profile-stat {
        text-align: center;
      }
      .profile-stat__value {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        color: var(--red);
      }
      .profile-stat__label {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .profile-bio {
        color: var(--text-muted);
        line-height: 1.7;
        margin-bottom: 24px;
      }
      .profile-field {
        margin-bottom: 12px;
        font-size: 0.9rem;
      }
      .profile-field__label {
        font-weight: 600;
        color: var(--text);
        margin-right: 6px;
      }
      .profile-field__value {
        color: var(--text-muted);
      }
      .profile-field a {
        color: var(--red);
        transition: color var(--transition);
      }
      .profile-field a:hover {
        color: var(--red-hover);
      }
      .profile-social {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
      }
      .profile-social a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.9rem;
        color: var(--text-muted);
        transition: color var(--transition);
      }
      .profile-social a:hover {
        color: var(--red);
      }
      .profile-actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 24px;
        justify-content: center;
        align-items: flex-end;
        padding-top: 20px;
      }
      .profile-section {
        margin-top: 32px;
        padding-top: 24px;
        border-top: 1px solid var(--border);
      }
      .profile-section__title {
        font-family: var(--font-serif);
        font-size: 1.2rem;
        margin-bottom: 16px;
      }
      .mini-book {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg3);
        border-radius: var(--radius);
        margin-bottom: 8px;
        transition: border-color var(--transition);
        border: 1px solid transparent;
        text-decoration: none;
        color: inherit;
      }
      .mini-book:hover {
        border-color: var(--red);
      }
      .mini-book__cover {
        width: 40px;
        height: 60px;
        border-radius: 4px;
        background: var(--surface);
        flex-shrink: 0;
      }
      .mini-book__cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 4px;
      }
      .mini-book__info {
        flex: 1;
      }
      .mini-book__title {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
      }
      .mini-book__genero {
        font-size: 0.75rem;
        color: var(--text-muted);
      }
      .profile-generos {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .profile-generos .badge {
        font-size: 0.7rem;
        padding: 4px 10px;
      }
      .profile-counters {
        display: flex;
        gap: 20px;
        margin-top: 8px;
      }
      .profile-counter {
        text-align: center;
      }
      .profile-counter__value {
        font-family: var(--font-serif);
        font-size: 1.3rem;
        color: var(--red);
        font-weight: 600;
      }
      .profile-counter__label {
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .profile-loading {
        text-align: center;
        padding: 40px;
      }
      .profile-loading__icon {
        font-size: 2rem;
        margin-bottom: 16px;
      }
      .profile-block {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin-bottom: 24px;
      }
      .profile-block__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }
      .profile-block__title {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        color: var(--text);
        margin: 0;
        font-weight: 600;
      }
      .profile-block__empty {
        text-align: center;
        padding: 24px;
        color: var(--text-muted);
        font-size: 0.9rem;
        font-style: italic;
      }
      .mini-collab {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        background: var(--bg3);
        border-radius: var(--radius);
        margin-bottom: 8px;
        transition: border-color var(--transition);
        border: 1px solid transparent;
        text-decoration: none;
        color: inherit;
      }
      .mini-collab:hover {
        border-color: var(--red);
      }
      .mini-collab__avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--red);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 1rem;
        flex-shrink: 0;
      }
      .mini-collab__info {
        flex: 1;
        min-width: 0;
      }
      .mini-collab__name {
        font-weight: 600;
        color: var(--text);
        font-size: 0.9rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-collab__sub {
        font-size: 0.8rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-collab__badge {
        font-size: 0.7rem;
        padding: 4px 10px;
        background: var(--surface);
        border-radius: 20px;
        color: var(--text-muted);
        text-transform: capitalize;
        flex-shrink: 0;
      }
      .mini-collab__rating {
        color: var(--gold);
        font-size: 0.85rem;
        letter-spacing: 2px;
        margin-top: 4px;
        display: inline-block;
      }
      .mini-collab__review {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin: 6px 0 0 0;
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mini-review {
        padding: 16px;
        background: var(--bg3);
        border-radius: var(--radius);
        margin-bottom: 8px;
        cursor: pointer;
        transition:
          border-color var(--transition),
          background var(--transition);
        border: 1px solid transparent;
      }
      .mini-review:hover {
        border-color: var(--red);
        background: var(--surface);
      }
      .mini-review__top {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .mini-review__stars {
        color: var(--gold);
        font-size: 0.9rem;
        letter-spacing: 1px;
      }
      .mini-review__mood {
        font-size: 0.75rem;
        padding: 2px 8px;
        background: var(--red);
        color: var(--white);
        border-radius: 12px;
        font-weight: 500;
      }
      .mini-review__text {
        font-size: 0.85rem;
        color: var(--text-muted);
        line-height: 1.6;
        margin: 0 0 8px 0;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .mini-review__tag {
        display: inline-block;
        font-size: 0.75rem;
        padding: 3px 10px;
        background: var(--surface);
        border-radius: 12px;
        color: var(--text-muted);
        font-weight: 500;
      }
      .mini-leido {
        display: flex;
        gap: 12px;
        padding: 12px;
        background: var(--bg3);
        border-radius: var(--radius);
        margin-bottom: 8px;
        transition: border-color var(--transition);
        border: 1px solid transparent;
        text-decoration: none;
        color: inherit;
      }
      .mini-leido:hover {
        border-color: var(--red);
      }
      .mini-leido__cover {
        width: 40px;
        height: 60px;
        border-radius: 4px;
        background: var(--surface);
        flex-shrink: 0;
        overflow: hidden;
      }
      .mini-leido__cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 4px;
      }
      .mini-leido__title {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-leido__author {
        font-size: 0.8rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .modal {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        padding: 28px;
        position: relative;
        animation: modalIn 0.25s ease;
        overflow-y: auto;
      }
      @keyframes modalIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .modal__close {
        position: absolute;
        top: 16px;
        right: 16px;
        background: var(--surface);
        border: none;
        color: var(--text-muted);
        font-size: 1.4rem;
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all var(--transition);
        z-index: 10;
      }
      .modal__close:hover {
        color: var(--red);
        background: var(--bg3);
      }
      .modal__title {
        font-family: var(--font-serif);
        font-size: 1.3rem;
        margin-bottom: 20px;
        padding-right: 40px;
      }
      .modal .form-group {
        margin-bottom: 16px;
      }
      .modal .form-group label {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--text-dim);
        display: block;
        margin-bottom: 6px;
      }
      .modal .form-group input,
      .modal .form-group select,
      .modal .form-group textarea {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 14px;
        border-radius: var(--radius);
        font-size: 0.9rem;
        font-family: var(--font-sans);
        box-sizing: border-box;
      }
      .modal .form-group input:focus,
      .modal .form-group select:focus,
      .modal .form-group textarea:focus {
        outline: none;
        border-color: var(--red);
        background: var(--bg3);
      }
      .modal .form-group textarea {
        min-height: 80px;
        resize: vertical;
      }
      .modal__actions {
        display: flex;
        gap: 12px;
        margin-top: 24px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }
      .modal__actions .btn {
        flex: 1;
        justify-content: center;
      }
      @media (max-width: 768px) {
        .profile-block {
          padding: 20px;
        }
        .profile-block__header {
          flex-direction: column;
          align-items: flex-start;
          gap: 8px;
        }
        .profile-block__title {
          font-size: 1rem;
        }
        .mini-collab,
        .mini-review,
        .mini-leido {
          padding: 10px;
        }
        .mini-collab__avatar {
          width: 36px;
          height: 36px;
        }
        .mini-leido__cover {
          width: 36px;
          height: 54px;
        }
        .modal__actions {
          flex-direction: column-reverse;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>
    <section class="profile-hero">
      <div class="container">
        <div class="profile-card" id="profile-content">
          <div class="profile-loading">
            <div class="profile-loading__icon">⏳</div>
            <p>Cargando perfil...</p>
          </div>
        </div>
        <br /><br />
        <div class="profile-extra" id="profile-extra"></div>
      </div>
    </section>

    <!-- MODAL INVITAR -->
    <div id="invite-collab-modal" class="modal-overlay">
      <div class="modal">
        <button class="modal__close" id="btn-close-invite-modal">×</button>
        <h3 class="modal__title" id="invite-modal-title">
          Invitar a colaborar
        </h3>
        <form id="invite-collab-form">
          <input type="hidden" id="invite-bs-id" />
          <input type="hidden" id="invite-bs-tarifa" />
          <div class="form-group">
            <label>Selecciona tu libro *</label>
            <select id="invite-libro-select" required>
              <option value="">Cargando tus libros...</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tarifa a pagar (€)</label>
            <input
              type="number"
              id="invite-tarifa"
              readonly
              tabindex="-1"
              style="
                opacity: 0.6;
                cursor: not-allowed;
                background: var(--surface);
                pointer-events: none;
              "
            />
            <small style="color: var(--text-dim)"
              >Tarifa fijada por el bookstagramer. Se cobrará si acepta.</small
            >
          </div>
          <div class="form-group">
            <label>Mensaje (opcional)</label>
            <textarea
              id="invite-mensaje"
              placeholder="Cuéntale por qué te gustaría que reseñe tu libro..."
            ></textarea>
          </div>
          <div class="modal__actions">
            <button
              type="submit"
              class="btn btn-primary"
              id="btn-submit-invite"
            >
              Enviar invitación
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              id="btn-cancel-invite"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
    <div id="footer-placeholder"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script>
      injectShell("");
      function openInviteCollabModal(
        bookstagramerId,
        bookstagramerNombre,
        tarifaBS,
      ) {
        const currentUser = usuarioActual();
        if (!currentUser) {
          showToast("⚠️ Debes iniciar sesión como escritor");
          return;
        }
        if (currentUser?.get("rol") !== "escritor") {
          showToast("⚠️ Solo los escritores pueden invitar a colaborar");
          return;
        }
        const modal = document.getElementById("invite-collab-modal");
        document.getElementById("invite-bs-id").value = bookstagramerId;
        document.getElementById("invite-bs-tarifa").value = tarifaBS || 0;
        document.getElementById("invite-modal-title").textContent =
          `Invitar a ${bookstagramerNombre}`;
        document.getElementById("invite-tarifa").value = tarifaBS || "";
        const select = document.getElementById("invite-libro-select");
        select.innerHTML = '<option value="">Cargando libros...</option>';
        select.disabled = true;
        getMisLibros(currentUser.id)
          .then((libros) => {
            select.innerHTML = libros.length
              ? libros
                  .map(
                    (b) => `<option value="${b.libroId}">${b.titulo}</option>`,
                  )
                  .join("")
              : '<option value="">No tienes libros publicados</option>';
            select.disabled = false;
          })
          .catch(() => {
            select.innerHTML =
              '<option value="">Error cargando libros</option>';
          });
        modal.style.display = "flex";
      }
      function closeInviteCollabModal() {
        const modal = document.getElementById("invite-collab-modal");
        if (modal) modal.style.display = "none";
        const form = document.getElementById("invite-collab-form");
        if (form) form.reset();
        const select = document.getElementById("invite-libro-select");
        if (select) select.disabled = false;
      }

      async function loadProfile() {
        const params = new URLSearchParams(location.search);
        const userId = params.get("id");
        if (!userId) {
          renderError("Perfil no especificado.");
          return;
        }
        try {
          const perfil = await getPerfilPublico(userId);
          if (!perfil) {
            renderError("Usuario no encontrado o perfil privado.");
            return;
          }
          const currentUser = Parse.User.current();
          const isFollowing =
            currentUser?.get("following")?.includes(userId) || false;
          const rol = perfil.rol || "lector";
          const nombre = perfil.nombre || perfil.displayName || "Usuario";
          let html = renderProfileHeader(nombre, rol);
          html += renderProfileStats(
            perfil.seguidoresAdEA || 0,
            rol,
            null,
            perfil,
          );
          html += renderProfileFields(rol, perfil, null);
          html += renderProfileActions(
            rol,
            currentUser,
            userId,
            isFollowing,
            null,
            perfil,
          );
          document.getElementById("profile-content").innerHTML = html;
          await renderExtraSections(rol, userId, nombre, perfil);
        } catch (err) {
          renderError("Error al cargar el perfil.");
        }
      }

      function renderProfileHeader(nombre, rol) {
        return `<div class="profile-header"><div class="profile-avatar">${nombre.charAt(0).toUpperCase()}</div><div><div class="profile-name">${nombre}</div><div class="profile-rol">${rol.toUpperCase()}</div></div></div>`;
      }
      function renderProfileStats(seguidoresAdEA, rol, user, perfil) {
        let html = `<div class="profile-stats"><div class="profile-stat"><div class="profile-stat__value" id="stat-followers">${seguidoresAdEA}</div><div class="profile-stat__label">Seguidores en AdEA</div></div>`;
        if (rol === "bookstagramer") {
          const seguidoresIG =
            perfil?.seguidoresIG || user?.get("seguidores") || 0;
          const tarifa = perfil?.tarifa || user?.get("tarifa") || 0;
          if (seguidoresIG > 0)
            html += `<div class="profile-stat"><div class="profile-stat__value">${seguidoresIG}</div><div class="profile-stat__label">Seguidores IG</div></div>`;
          if (tarifa > 0)
            html += `<div class="profile-stat"><div class="profile-stat__value">${tarifa}€</div><div class="profile-stat__label">Tarifa</div></div>`;
        }
        return html + `</div>`;
      }
      function renderProfileFields(rol, perfil, user) {
        let html = "";
        const campos = [];
        const bio = perfil?.bio || user?.get("bio") || "";
        const web = perfil?.web || user?.get("web") || "";
        const instagram = perfil?.instagram || user?.get("instagram") || "";
        const email = perfil?.email || user?.get("email") || "";
        if (bio) campos.push(`<p class="profile-bio">${bio}</p>`);
        if (web)
          campos.push(
            `<p class="profile-field"><span class="profile-field__label">Web:</span><span class="profile-field__value"><a href="${web.startsWith("http") ? web : "https://" + web}" target="_blank" rel="noopener">${web}</a></span></p>`,
          );
        if (instagram)
          campos.push(
            `<div class="profile-social"><a href="https://instagram.com/${instagram.replace("@", "")}" target="_blank" rel="noopener">@${instagram.replace("@", "")}</a></div>`,
          );
        if (email && rol !== "lector")
          campos.push(
            `<p class="profile-field"><a href="mailto:${email}?bcc=elevatestarmkt@gmail.com" class="btn btn-secondary btn-sm">Contactar por email</a></p>`,
          );
        if (campos.length)
          html += `<div class="profile-section">${campos.join("")}</div>`;
        if (rol === "escritor") {
          const generos = perfil?.generosPrincipales || [];
          if (generos.length)
            html += `<div class="profile-section"><div class="profile-section__title">Géneros principales</div><div class="profile-generos">${generos.map((g) => `<span class="badge badge-gold">${g}</span>`).join("")}</div></div>`;
        }
        if (rol === "bookstagramer") {
          const condiciones =
            perfil?.condiciones || user?.get("condiciones") || "";
          const generoFav =
            perfil?.generoFavorito || user?.get("generoFavorito") || "";
          if (condiciones)
            html += `<div class="profile-section"><div class="profile-section__title">Condiciones</div><p class="profile-bio">${condiciones}</p></div>`;
          if (generoFav)
            html += `<p class="profile-field"><span class="profile-field__label">Género favorito:</span><span class="profile-field__value">${generoFav}</span></p>`;
          html += `<div class="profile-section"><div class="profile-section__title">Actividad</div><div class="profile-counters"><div class="profile-counter"><div class="profile-counter__value" id="count-reseñas">–</div><div class="profile-counter__label">Reseñas</div></div><div class="profile-counter"><div class="profile-counter__value" id="count-colabs">–</div><div class="profile-counter__label">Colaboraciones AdEA</div></div></div></div>`;
        }
        if (rol === "lector") {
          const generoFav =
            perfil?.generoFavorito || user?.get("generoFavorito") || "";
          if (generoFav)
            html += `<p class="profile-field"><span class="profile-field__label">Género favorito:</span><span class="profile-field__value">${generoFav}</span></p>`;
          html += `<div class="profile-section"><div class="profile-section__title">Actividad</div><div class="profile-counters"><div class="profile-counter"><div class="profile-counter__value" id="count-reseñas">–</div><div class="profile-counter__label">Reseñas escritas</div></div></div></div>`;
        }
        return html;
      }
      function renderProfileActions(
        rol,
        currentUser,
        userId,
        isFollowing,
        user,
        perfil,
      ) {
        let html = `<div class="profile-actions">`;
        if (currentUser && currentUser.id !== userId) {
          html += `<button class="btn ${isFollowing ? "btn-secondary" : "btn-primary"}" id="btn-follow" onclick="handleToggleFollow('${userId}')">${isFollowing ? "✓ Siguiendo" : "+ Seguir"}</button>`;
        }
        if (
          rol === "bookstagramer" &&
          currentUser?.get("rol") === "escritor" &&
          currentUser.id !== userId
        ) {
          const tarifaBS = perfil?.tarifa || user?.get("tarifa") || 0;
          const nombreBS = (
            perfil?.nombre ||
            user?.get("nombre") ||
            "Bookstagramer"
          ).replace(/'/g, "\\'");
          html += `<button class="btn btn-primary" onclick="openInviteCollabModal('${userId}','${nombreBS}',${tarifaBS})">🤝 Invitar a colaborar</button>`;
        }
        if (rol === "bookstagramer" && currentUser?.get("rol") === "escritor") {
          const email = perfil?.email || user?.get("email") || "";
          if (email)
            html += `<a href="mailto:${email}?bcc=elevatestarmkt@gmail.com" class="btn btn-ghost">✉️ Contactar</a>`;
        }
        return html + `</div>`;
      }

      async function renderWriterSection(escritorId, nombre) {
        try {
          const Book = Parse.Object.extend("Books");
          const qBook = new Parse.Query(Book);
          qBook.equalTo("escritorId", escritorId);
          qBook.equalTo("activo", true);
          qBook.descending("createdAt");
          qBook.limit(6);
          const libros = await qBook.find();
          if (!libros.length) return "";
          let html = `<div class="profile-section"><div class="profile-section__title">Libros publicados (${libros.length})<a href="catalogo.html?escritorId=${escritorId}" class="btn btn-secondary btn-sm" style="margin-left:12px;float:right">Ver todos →</a></div>`;
          libros.forEach((libro) => {
            html += `<a href="libro.html?id=${libro.get("libroId")}" class="mini-book"><div class="mini-book__cover"><img src="${libro.get("imagen") || ""}" onerror="this.src='assets/img/cover-placeholder.svg'" alt="${libro.get("titulo")}"></div><div class="mini-book__info"><div class="mini-book__title">${libro.get("titulo") || "Sin título"}</div><div class="mini-book__genero">${(libro.get("genero") || [])[0] || ""}</div></div></a>`;
          });
          return html + `</div>`;
        } catch {
          return "";
        }
      }
      async function renderBookstagramerSection(userId) {
        setTimeout(async () => {
          try {
            document.getElementById("count-reseñas").textContent =
              await contarResenasUsuario(userId);
            document.getElementById("count-colabs").textContent =
              await contarColaboracionesUsuario(userId);
          } catch {}
        }, 100);
        return "";
      }
      async function renderLectorSection(userId) {
        setTimeout(async () => {
          try {
            document.getElementById("count-reseñas").textContent =
              await contarResenasUsuario(userId);
          } catch {}
        }, 100);
        return "";
      }

      async function renderExtraSections(rol, userId, nombre, perfil) {
        const container = document.getElementById("profile-extra");
        container.innerHTML = `<div style="text-align:center;padding:20px;color:var(--text-dim);font-size:0.85rem;">Cargando secciones...</div>`;
        try {
          let blocks = [];
          if (rol === "escritor")
            blocks = await buildWriterBlocks(userId, nombre);
          else if (rol === "bookstagramer")
            blocks = await buildBookstagramerBlocks(userId);
          else blocks = await buildLectorBlocks(userId);
          container.innerHTML = blocks.length ? blocks.join("") : "";
        } catch (err) {
          container.innerHTML = "";
        }
      }

      /* ── ESCRITOR ── */
      async function buildWriterBlocks(userId, nombre) {
        const blocks = [];
        try {
          const Book = Parse.Object.extend("Books");
          const q = new Parse.Query(Book);
          q.equalTo("escritorId", userId);
          q.descending("createdAt");
          q.limit(3);
          const libros = await q.find();
          let inner = libros.length
            ? libros
                .map(
                  (l) =>
                    `<a href="libro.html?id=${l.get("libroId")}" class="mini-book"><div class="mini-book__cover"><img src="${l.get("imagen") || ""}" onerror="this.src='assets/img/cover-placeholder.svg'"></div><div class="mini-book__info"><div class="mini-book__title">${l.get("titulo")}</div><div class="mini-book__genero">${l.get("autor")}${(l.get("genero") || [])[0] ? " · " + (l.get("genero") || [])[0] : ""}</div></div></a>`,
                )
                .join("")
            : `<div class="profile-block__empty">No hay libros publicados aún.</div>`;
          blocks.push(
            `<div class="profile-block"><div class="profile-block__header"><h3 class="profile-block__title">📚 Últimos libros publicados</h3><a href="catalogo.html?escritorId=${userId}" class="btn btn-ghost btn-sm">Ver todos →</a></div>${inner}</div>`,
          );
        } catch (e) {}
        try {
          const Collab = Parse.Object.extend("Colaboraciones");
          const q = new Parse.Query(Collab);
          q.equalTo("autorId", userId);
          q.descending("createdAt");
          q.limit(50);
          const collabs = await q.find();
          let inner = collabs.length
            ? await Promise.all(
                collabs.map(async (c) => {
                  let titulo =
                    c.get("nombreLibro") ||
                    c.get("tituloLibro") ||
                    c.get("libro") ||
                    "Sin título";
                  const libroId = c.get("libroId");
                  if (titulo === "Sin título" && libroId) {
                    try {
                      const b = await new Parse.Query(
                        Parse.Object.extend("Books"),
                      )
                        .get(libroId)
                        .catch(() => null);
                      if (b) titulo = b.get("titulo");
                    } catch {}
                  }
                  let stars = "";
                  const p = c.get("puntuacion");
                  if (p != null) {
                    const e = Number(p) || 0;
                    stars =
                      "★".repeat(Math.floor(e)) +
                      (e % 1 >= 0.5 ? "½" : "") +
                      "☆".repeat(5 - Math.ceil(e));
                  }
                  let reviewText = "";
                  try {
                    const qRes = new Parse.Query(
                      Parse.Object.extend("Resenas"),
                    );
                    qRes.equalTo("usuarioId", c.get("bookstagramerId"));
                    qRes.equalTo("libroId", libroId);
                    const r = await qRes.first();
                    if (r) reviewText = r.get("texto") || "";
                  } catch {}
                  const content = `<div class="mini-collab__avatar">${(c.get("nombreBookstagramer") || "B").charAt(0).toUpperCase()}</div><div class="mini-collab__info"><div class="mini-collab__name">${c.get("nombreBookstagramer") || "Bookstagramer"}</div><div class="mini-collab__sub">📖 ${titulo}${stars ? `<br><span class="mini-collab__rating">${stars}</span>` : ""}</div>${reviewText ? `<p class="mini-collab__review">${reviewText.substring(0, 100)}...</p>` : ""}</div><span class="mini-collab__badge">${c.get("estado") || "pendiente"}</span>`;
                  return libroId
                    ? `<a href="libro.html?id=${libroId}" class="mini-collab">${content}</a>`
                    : `<div class="mini-collab">${content}</div>`;
                }),
              ).join("")
            : `<div class="profile-block__empty">No hay colaboraciones registradas.</div>`;
          blocks.push(
            `<div class="profile-block"><div class="profile-block__header"><h3 class="profile-block__title">🤝 Colaboraciones</h3></div>${inner}</div>`,
          );
        } catch (e) {}
        return blocks;
      }

      /* ── BOOKSTAGRAMER ── */
      async function buildBookstagramerBlocks(userId) {
        const blocks = [];
        // ✅ Orden: Reseñas -> Recomendaciones -> Leídos -> Colaboraciones (todas al final)
        blocks.push(await buildResenasBlock(userId));
        blocks.push(await buildRecomendacionesBlock(userId));

        try {
          const Collab = Parse.Object.extend("Colaboraciones");
          let q = new Parse.Query(Collab);
          q.equalTo("bookstagramerId", userId);
          q.descending("createdAt");
          q.limit(200);
          let collabs = await q.find();
          if (!collabs.length) {
            q = new Parse.Query(Collab);
            q.equalTo("bookstagramer", {
              __type: "Pointer",
              className: "_User",
              objectId: userId,
            });
            q.descending("createdAt");
            q.limit(200);
            collabs = await q.find();
          }
          let inner = collabs.length
            ? await Promise.all(
                collabs.map(async (c) => {
                  let libro =
                    c.get("nombreLibro") ||
                    c.get("tituloLibro") ||
                    c.get("libro") ||
                    "Sin título";
                  const libroId = c.get("libroId");
                  if (libro === "Sin título" && libroId) {
                    try {
                      const b = await new Parse.Query(
                        Parse.Object.extend("Books"),
                      )
                        .get(libroId)
                        .catch(() => null);
                      if (b) libro = b.get("titulo");
                    } catch {}
                  }
                  let stars = "";
                  const p = c.get("puntuacion");
                  if (p != null) {
                    const e = Number(p) || 0;
                    stars =
                      "★".repeat(Math.floor(e)) +
                      (e % 1 >= 0.5 ? "½" : "") +
                      "☆".repeat(5 - Math.ceil(e));
                  }
                  let reviewText = "";
                  try {
                    if (libroId) {
                      const qRes = new Parse.Query(
                        Parse.Object.extend("Resenas"),
                      );
                      qRes.equalTo("usuarioId", userId);
                      qRes.equalTo("libroId", libroId);
                      const r = await qRes.first();
                      if (r) reviewText = r.get("texto") || "";
                    }
                  } catch {}
                  const content = `<div class="mini-collab__avatar">${(c.get("nombreAutor") || "A").charAt(0).toUpperCase()}</div><div class="mini-collab__info"><div class="mini-collab__name">${c.get("nombreAutor") || "Autor"}</div><div class="mini-collab__sub">📖 ${libro}${stars ? `<br><span class="mini-collab__rating">${stars}</span>` : ""}</div>${reviewText ? `<p class="mini-collab__review">${reviewText.substring(0, 100)}...</p>` : ""}</div><span class="mini-collab__badge">${c.get("estado") || "pendiente"}</span>`;
                  return libroId
                    ? `<a href="libro.html?id=${libroId}" class="mini-collab">${content}</a>`
                    : `<div class="mini-collab">${content}</div>`;
                }),
              ).join("")
            : `<div class="profile-block__empty">No hay colaboraciones aún.</div>`;
          blocks.push(
            `<div class="profile-block"><div class="profile-block__header"><h3 class="profile-block__title">🤝 Colaboraciones</h3></div>${inner}</div>`,
          );
        } catch (e) {}
        blocks.push(await buildLeidosBlock(userId));
        return blocks;
      }

      /* ── LECTOR ── */
      async function buildLectorBlocks(userId) {
        // ✅ Orden: Reseñas -> Recomendaciones -> Leídos
        return [
          await buildResenasBlock(userId),
          await buildRecomendacionesBlock(userId),
          await buildLeidosBlock(userId),
        ];
      }

      /* ── BLOQUES REUTILIZABLES ── */
      async function buildResenasBlock(userId) {
        try {
          const Resena = Parse.Object.extend("Resenas");
          const q = new Parse.Query(Resena);
          q.equalTo("usuarioId", userId);
          q.descending("createdAt");
          q.limit(5); // ✅ Solo 5 para el perfil
          const resenas = await q.find();

          const libroIds = [
            ...new Set(resenas.map((r) => r.get("libroId")).filter(Boolean)),
          ];
          const libroMap = {};
          if (libroIds.length) {
            const bq = new Parse.Query(Parse.Object.extend("Books"));
            bq.containedIn("libroId", libroIds);
            bq.limit(100);
            (await bq.find()).forEach((b) => {
              libroMap[b.get("libroId")] = {
                titulo: b.get("titulo"),
                id: b.get("libroId"),
              };
            });
          }

          let inner = resenas.length
            ? resenas
                .map((r) => {
                  const estrellas = r.get("estrellas") || 0;
                  const texto = r.get("texto") || "";
                  const mood = r.get("mood") || "";
                  const etiqueta = r.get("etiqueta") || "";
                  const libroId = r.get("libroId");
                  const info = libroMap[libroId];
                  const stars =
                    "★".repeat(Math.floor(estrellas)) +
                    (estrellas % 1 >= 0.5 ? "½" : "") +
                    "☆".repeat(5 - Math.ceil(estrellas));
                  return `<div class="mini-review" onclick="location.href='libro.html?id=${libroId}'">
        <div class="mini-review__top">
          ${info ? `<span style="font-size:0.78rem;font-weight:600;color:var(--text);max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📖 ${info.titulo}</span>` : ""}
          <span class="mini-review__stars">${stars}</span>
          ${mood ? `<span class="mini-review__mood">${mood}</span>` : ""}
        </div>
        <p class="mini-review__text">${texto}</p>
        ${etiqueta ? `<span class="mini-review__tag">${etiqueta}</span>` : ""}
      </div>`;
                })
                .join("")
            : `<div class="profile-block__empty">No hay reseñas publicadas aún.</div>`;

          // ✅ Enlace "Ver más" si hay 5 o más reseñas
          const verMas =
            resenas.length >= 5
              ? `<a href="resenas.html?id=${userId}" style="font-size:0.8rem;color:var(--red);text-decoration:underline;align-self:center;margin-top:8px">Ver todas las reseñas →</a>`
              : "";

          return `<div class="profile-block">
      <div class="profile-block__header">
        <h3 class="profile-block__title">✍️ Últimas reseñas publicadas</h3>
        ${verMas}
      </div>
      ${inner}
    </div>`;
        } catch {
          return `<div class="profile-block"><div class="profile-block__empty">Error cargando reseñas.</div></div>`;
        }
      }

      async function buildRecomendacionesBlock(userId) {
        try {
          const Sug = Parse.Object.extend("SugerenciasLibros");
          const q = new Parse.Query(Sug);
          q.equalTo("usuario", {
            __type: "Pointer",
            className: "_User",
            objectId: userId,
          });
          q.descending("createdAt");
          q.limit(5); // ✅ LIMIT 5
          const sugerencias = await q.find();
          let inner = sugerencias.length
            ? sugerencias
                .map((s) => {
                  const titulo = s.get("titulo") || "Libro sugerido";
                  const autor = s.get("autor") || "";
                  const estado = s.get("estado") || "pendiente";
                  const ok = estado === "aceptada";
                  return `<div class="mini-book" style="cursor:default;border-left:3px solid ${ok ? "#4ade80" : "#facc15"}"><div class="mini-book__cover" style="display:flex;align-items:center;justify-content:center;background:var(--surface);font-size:1.5rem">📖</div><div class="mini-book__info"><div class="mini-book__title">${titulo} ${ok ? "✅" : "⏳"}</div><div class="mini-book__genero">${autor}</div></div></div>`;
                })
                .join("")
            : `<div class="profile-block__empty">No hay recomendaciones aún.</div>`;
          return `<div class="profile-block"><div class="profile-block__header"><h3 class="profile-block__title">🌟 Recomendaciones</h3></div>${inner}</div>`;
        } catch {
          return `<div class="profile-block"><div class="profile-block__empty">Error cargando recomendaciones.</div></div>`;
        }
      }

      async function buildLeidosBlock(userId) {
        try {
          let leidos = [];
          try {
            leidos = await Parse.Cloud.run("getPublicLeidos", { userId });
          } catch {
            const q = new Parse.Query(Parse.Object.extend("Leidos"));
            q.equalTo("usuario", {
              __type: "Pointer",
              className: "_User",
              objectId: userId,
            });
            q.descending("createdAt");
            q.limit(5); // ✅ LIMIT 5
            leidos = await q.find();
          }
          const libroIds = [
            ...new Set(leidos.map((l) => l.get("libroId")).filter(Boolean)),
          ];
          const libroMap = {};
          if (libroIds.length) {
            const bq = new Parse.Query(Parse.Object.extend("Books"));
            bq.containedIn("libroId", libroIds);
            bq.limit(100);
            (await bq.find()).forEach((b) => {
              libroMap[b.get("libroId")] = b;
            });
          }
          let inner = leidos
            .map((l) => {
              const libroId = l.get("libroId");
              const book = libroMap[libroId];
              if (!book) return "";
              return `<a href="libro.html?id=${libroId}" class="mini-leido"><div class="mini-leido__cover"><img src="${book.get("imagen") || ""}" onerror="this.src='assets/img/cover-placeholder.svg'"></div><div><div class="mini-leido__title">${book.get("titulo") || "Sin título"}</div><div class="mini-leido__author">${book.get("autor") || ""}</div></div></a>`;
            })
            .join("");
          const verMas =
            leidos.length >= 5
              ? `<a href="leidos.html?id=${userId}" style="font-size:0.8rem;color:var(--red);text-decoration:underline;align-self:center;margin-top:8px">Ver todos los leídos →</a>`
              : "";
          return `<div class="profile-block"><div class="profile-block__header"><h3 class="profile-block__title">📗 Últimos libros leídos</h3>${verMas}</div>${inner || `<div class="profile-block__empty">No hay libros marcados como leídos.</div>`}</div>`;
        } catch (e) {
          return `<div class="profile-block"><div class="profile-block__empty">Error cargando leídos.</div></div>`;
        }
      }

      function renderError(mensaje) {
        document.getElementById("profile-content").innerHTML =
          `<div style="text-align:center;padding:40px;"><div style="font-size:2rem;margin-bottom:16px">❌</div><p>${mensaje}</p><a href="catalogo.html" class="btn btn-primary" style="margin-top:16px;">Volver</a></div>`;
      }
      async function handleToggleFollow(targetUserId) {
        try {
          const result = await Parse.Cloud.run("toggleFollow", {
            targetUserId,
          });
          if (result.ok) {
            showToast(
              result.siguiendo
                ? "✅ Ahora sigues a este usuario"
                : "❌ Dejaste de seguir",
            );
            await Parse.User.current()?.fetch();
            await loadProfile();
          }
        } catch (err) {
          showToast("❌ " + err.message);
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadProfile();
        document
          .getElementById("btn-close-invite-modal")
          .addEventListener("click", closeInviteCollabModal);
        document
          .getElementById("btn-cancel-invite")
          .addEventListener("click", closeInviteCollabModal);
        document
          .getElementById("invite-collab-modal")
          .addEventListener("click", (e) => {
            if (e.target.id === "invite-collab-modal") closeInviteCollabModal();
          });
        document
          .getElementById("invite-collab-form")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const bsId = document.getElementById("invite-bs-id").value;
            const libroId = parseInt(
              document.getElementById("invite-libro-select").value,
            );
            const mensaje = document
              .getElementById("invite-mensaje")
              .value.trim();
            if (isNaN(libroId) || libroId <= 0) {
              showToast("⚠️ Selecciona un libro");
              return;
            }
            const tarifa =
              parseFloat(document.getElementById("invite-bs-tarifa").value) ||
              0;
            const btn = document.getElementById("btn-submit-invite");
            btn.disabled = true;
            btn.textContent = "Enviando…";
            const result = await solicitarColaboracion({
              tipo: "escritor_a_bookstagramer",
              libroId,
              destinatarioId: bsId,
              tarifa,
              mensaje: mensaje || "Hola, me gustaría que reseñaras mi libro.",
            });
            if (result.ok) {
              showToast("✅ Invitación enviada.");
              closeInviteCollabModal();
            } else {
              showToast("❌ Error: " + (result.error || "No se pudo enviar"));
            }
            btn.disabled = false;
            btn.textContent = "Enviar invitación";
          });
      });
    </script>
  </body>
</html>
