<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico" />
    <title>Comunidad - AdEA</title>
    <meta
      name="description"
      content="Descubre reseñas reales de lectores apasionados. Sin nombres, sin portadas. Solo historias que te harán sentir."
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      .comunidad-hero {
        padding: 120px 0 48px;
        text-align: center;
      }
      .comunidad-search {
        max-width: 480px;
        margin: 0 auto 24px;
        position: relative;
      }
      .comunidad-search input {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 12px 16px 12px 44px;
        border-radius: 30px;
        font-family: var(--font-sans);
        font-size: 0.9rem;
        transition: border-color var(--transition);
      }
      .comunidad-search input:focus {
        outline: none;
        border-color: var(--red);
      }
      .comunidad-search svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        pointer-events: none;
      }
      .comunidad-filters {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        margin: 24px 0 40px;
      }
      .filter-chip {
        padding: 8px 20px;
        border-radius: 30px;
        border: 1px solid var(--border);
        background: var(--surface);
        cursor: pointer;
        transition: all var(--transition);
        font-size: 0.85rem;
        color: var(--text);
      }
      .filter-chip.active,
      .filter-chip:hover {
        border-color: var(--red);
        background: var(--red-glow);
        color: var(--text);
      }
      .reviews-anonimas {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 24px;
      }
      .review-anonima {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 24px;
        cursor: pointer;
        transition: border-color var(--transition);
      }
      .review-anonima:hover {
        border-color: var(--red);
      }
      .review-anonima__text {
        font-family: var(--font-serif);
        font-size: 1.1rem;
        line-height: 1.7;
        font-style: italic;
        margin-bottom: 16px;
        text-align: justify;
      }
      .review-anonima__meta {
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-bottom: 16px;
      }
      .review-anonima__stars {
        color: var(--gold);
      }
      .review-anonima__mood {
        background: var(--surface);
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 0.75rem;
      }
      .review-anonima__cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--red);
        color: var(--white);
        padding: 10px 20px;
        border-radius: var(--radius);
        font-weight: 600;
        font-size: 0.85rem;
        transition: background var(--transition);
      }
      .review-anonima__cta:hover {
        background: var(--red-hover);
      }
      .profiles-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
        margin-top: 48px;
      }
      .profile-mini {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: all var(--transition);
        text-decoration: none;
        display: block;
        position: relative;
      }
      .profile-mini:hover {
        border-color: var(--red);
        transform: translateY(-2px);
      }
      .profile-mini__avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--red);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 auto 12px;
      }
      .profile-mini__name {
        font-weight: 600;
        margin-bottom: 4px;
        color: var(--text);
      }
      .profile-mini__rol {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-transform: uppercase;
      }
      .profile-mini__bio {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 8px;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .profile-mini__followers {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
      }
      .profile-mini__followers strong {
        color: var(--red);
        font-family: var(--font-serif);
      }
      /* BOTÓN SEGUIR */
      .profile-mini__follow {
    position: absolute;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    width: calc(100% - 40px);
    max-width: 160px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    z-index: 2;
}
      .profile-mini__follow:hover {
        border-color: var(--red);
        background: var(--red-glow);
      }
      .profile-mini__follow.following {
        background: var(--red);
        border-color: var(--red);
        color: var(--white);
      }
      .profile-mini__follow.loading {
        opacity: 0.6;
        cursor: wait;
      }
      .profile-mini__follow:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      /* PAGINACIÓN */
      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        flex-wrap: wrap;
      }
      .pagination__btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg2);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 0.85rem;
        cursor: pointer;
        transition: all var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .pagination__btn:hover,
      .pagination__btn.active {
        background: var(--red);
        border-color: var(--red);
        color: var(--white);
      }
      .pagination__btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .pagination__info {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin: 0 12px;
      }
      .empty-state {
        text-align: center;
        padding: 40px 20px;
        color: var(--text-muted);
        grid-column: 1 / -1;
      }
      .empty-state__icon {
        font-size: 2.5rem;
        margin-bottom: 12px;
      }
      .loading-state {
        text-align: center;
        padding: 40px;
        color: var(--text-muted);
        grid-column: 1 / -1;
      }
      .loading-state__spinner {
        font-size: 2rem;
        animation: spin 1s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (max-width: 768px) {
        .reviews-anonimas {
          grid-template-columns: 1fr;
        }
        .profiles-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .comunidad-filters {
          gap: 8px;
        }
        .filter-chip {
          padding: 6px 14px;
          font-size: 0.8rem;
        }
      }
      @media (max-width: 480px) {
        .profiles-grid {
          grid-template-columns: 1fr 1fr;
        }
        .pagination__btn {
          width: 32px;
          height: 32px;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>

    <section class="comunidad-hero">
      <div class="container">
        <span class="section-header__label">Comunidad real</span>
        <h1>Reseñas sin filtros</h1>
        <p style="max-width: 600px; margin: 0 auto 24px">
          Lee lo que otros sienten al leer. Sin nombres de libros, sin portadas,
          sin autores. Solo la emoción pura. ¿Te gusta? Cómpralo en Amazon.
        </p>

        <!-- 🔍 BUSCADOR POR NOMBRE -->
        <div class="comunidad-search">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            viewBox="0 0 24 24"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="search-users"
            placeholder="Buscar usuarios por nombre..."
          />
        </div>

        <div class="comunidad-filters" id="rol-filters">
          <button class="filter-chip active" data-rol="">Todos</button>
          <button class="filter-chip" data-rol="lector">📖 Lectores</button>
          <button class="filter-chip" data-rol="escritor">✍️ Escritores</button>
          <button class="filter-chip" data-rol="bookstagramer">
            📸 Bookstagramers
          </button>
        </div>
      </div>
    </section>

    <section class="section-sm" style="background: var(--bg2)">
      <div class="container">
        <h2
          style="
            margin-bottom: 24px;
            font-family: var(--font-serif);
            text-align: center;
          "
        >
          Perfiles de la comunidad
        </h2>
        <div class="profiles-grid" id="profiles-grid">
          <div class="loading-state">
            <div class="loading-state__spinner">⏳</div>
            <p>Cargando perfiles...</p>
          </div>
        </div>
        <!-- PAGINACIÓN -->
        <div class="pagination" id="profiles-pagination" style="display: none">
          <button class="pagination__btn" id="prev-page" disabled>←</button>
          <span class="pagination__info" id="page-info">Página 1</span>
          <button class="pagination__btn" id="next-page">→</button>
        </div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <h2 style="margin-bottom: 24px; font-family: var(--font-serif)">
          Últimas reseñas
        </h2>
        <div class="reviews-anonimas" id="reviews-grid"></div>
      </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script>
      injectShell("");

      // ==================== ESTADO GLOBAL ====================
      let activeRol = "";
      let searchQuery = "";
      let allReviews = [];
      let allProfiles = [];
      let profilesByUserId = {};

      // Paginación
      const PROFILES_PER_PAGE = 12;
      let currentPage = 1;
      let filteredProfiles = [];

      // Seguimiento de usuarios que sigues
      let followingSet = new Set();

      // ==================== CARGA INICIAL ====================
      async function loadComunidad() {
        try {
          // Cargar usuario actual para saber a quién sigues
          const currentUser = Parse.User.current();
          if (currentUser) {
            const following = currentUser.get("following") || [];
            followingSet = new Set(following);
          }

          // Cargar reseñas
          allReviews = await getUltimasResenas(50);

          // Cargar perfiles
          allProfiles = await getTodosLosPerfiles();
          profilesByUserId = {};
          allProfiles.forEach((p) => {
            if (p?.userId) profilesByUserId[p.userId] = p;
          });

          // Renderizar
          renderReviews();
          applyProfileFiltersAndRender();

          console.log("✅ Perfiles cargados:", allProfiles.length);
          console.log("✅ Reseñas cargadas:", allReviews.length);
        } catch (err) {
          console.error("❌ Error cargando comunidad:", err.message);
          document.getElementById("profiles-grid").innerHTML =
            `<div class="empty-state"><div class="empty-state__icon">⚠️</div><p>Error al cargar la comunidad</p></div>`;
        }
      }

      // ==================== RESEÑAS ====================
      function renderReviews() {
        const grid = document.getElementById("reviews-grid");
        let filtered = [...allReviews];

        if (activeRol) {
          filtered = filtered.filter((r) => {
            const perfil = profilesByUserId[r.usuarioId];
            return perfil?.rol === activeRol;
          });
        }

        if (!filtered.length) {
          grid.innerHTML = `<div class="empty-state"><div class="empty-state__icon">📚</div><p>No hay reseñas aún con este filtro.</p></div>`;
          return;
        }

        grid.innerHTML = filtered
          .slice(0, 12)
          .map((r) => {
            const stars =
              "★".repeat(Math.floor(r.estrellas)) +
              "☆".repeat(5 - Math.floor(r.estrellas));
            const textoCorto =
              r.texto?.length > 180
                ? r.texto.substring(0, 180) + "…"
                : r.texto || "";

            return `
<div class="review-anonima fade-in" onclick="window.location.href='libro.html?id=${r.libroId}'">
  <p class="review-anonima__text">"${textoCorto}"</p>
  <div class="review-anonima__meta">
    <span class="review-anonima__stars">${stars}</span>
    ${r.mood ? `<span class="review-anonima__mood">${r.mood}</span>` : ""}
  </div>
  ${
    r.etiqueta
      ? `<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; background: var(--surface); padding: 3px 10px; border-radius: 12px; max-width: fit-content;">${r.etiqueta}</p>`
      : ""
  }
  <a href="${r.afiliadoUrl || "#"}" target="_blank" rel="noopener sponsored" class="review-anonima__cta" 
     onclick="event.stopPropagation(); if(typeof trackClick==='function') trackClick('${r.libroId}')">
    Comprar
  </a>
</div>`;
          })
          .join("");
        initFadeIn();
      }

      // ==================== PERFILES CON PAGINACIÓN ====================
      function applyProfileFiltersAndRender() {
        // Filtrar por rol
        let filtered = allProfiles.filter((p) => {
          if (!p?.rol) return false;
          return activeRol ? p.rol === activeRol : true;
        });

        // Filtrar por búsqueda
        if (searchQuery.trim()) {
          const query = searchQuery.toLowerCase().trim();
          filtered = filtered.filter((p) => {
            const nombre = (p.nombre || p.displayName || "").toLowerCase();
            return nombre.includes(query);
          });
        }

        // ✅ ORDENAR POR SEGUIDORES (de mayor a menor)
        filtered.sort((a, b) => {
          const followersA =
            typeof a.seguidoresAdEA === "number" ? a.seguidoresAdEA : 0;
          const followersB =
            typeof b.seguidoresAdEA === "number" ? b.seguidoresAdEA : 0;
          return followersB - followersA;
        });

        filteredProfiles = filtered;
        currentPage = 1;
        renderProfilesPage();
        renderPagination();
      }

      function renderProfilesPage() {
        const grid = document.getElementById("profiles-grid");
        const pagination = document.getElementById("profiles-pagination");

        if (!filteredProfiles.length) {
          grid.innerHTML = `<div class="empty-state"><div class="empty-state__icon">👥</div><p>${searchQuery ? "No hay usuarios con ese nombre" : "No hay perfiles con este filtro"}</p></div>`;
          pagination.style.display = "none";
          return;
        }

        pagination.style.display = "flex";

        const start = (currentPage - 1) * PROFILES_PER_PAGE;
        const end = start + PROFILES_PER_PAGE;
        const pageProfiles = filteredProfiles.slice(start, end);
        const currentUser = Parse.User.current();

        grid.innerHTML = pageProfiles
          .map((p) => {
            const nombre = p.nombre || p.displayName || "Usuario";
            const initial = nombre.charAt(0).toUpperCase();
            const bioCorta = p.bio
              ? p.bio.length > 60
                ? p.bio.substring(0, 60) + "…"
                : p.bio
              : "";
            const seguidores =
              typeof p.seguidoresAdEA === "number" ? p.seguidoresAdEA : 0;
            const isFollowing = followingSet.has(p.userId);
            const isOwnProfile = currentUser && currentUser.id === p.userId;

            return `
<a href="perfil.html?id=${p.userId}" class="profile-mini" data-user-id="${p.userId}">
  <div class="profile-mini__avatar">${initial}</div>
  <div class="profile-mini__name">${nombre}</div>
  <div class="profile-mini__followers">
    <span></span><strong id="followers-${p.userId}">${seguidores}</strong> seguidores
  </div>
  <div class="profile-mini__rol">${p.rol}</div>
  ${
    !isOwnProfile
      ? `
  <button 
    class="profile-mini__follow ${isFollowing ? "following" : ""}" 
    data-target="${p.userId}"
    onclick="handleFollowClick(event, '${p.userId}')"
  >
    ${isFollowing ? "✓ Siguiendo" : "+ Seguir"}
  </button>`
      : ""
  }
</a>`;
          })
          .join("");
      }

      function renderPagination() {
        const pagination = document.getElementById("profiles-pagination");
        const totalPages = Math.ceil(
          filteredProfiles.length / PROFILES_PER_PAGE,
        );

        if (totalPages <= 1) {
          pagination.style.display = "none";
          return;
        }

        pagination.style.display = "flex";
        document.getElementById("page-info").textContent =
          `Página ${currentPage} de ${totalPages}`;
        document.getElementById("prev-page").disabled = currentPage === 1;
        document.getElementById("next-page").disabled =
          currentPage === totalPages;
      }

      function changePage(direction) {
        const totalPages = Math.ceil(
          filteredProfiles.length / PROFILES_PER_PAGE,
        );
        const newPage = currentPage + direction;

        if (newPage < 1 || newPage > totalPages) return;

        currentPage = newPage;
        renderProfilesPage();
        renderPagination();

        // Scroll suave hacia la sección de perfiles
        const section = document.querySelector(".profiles-grid");
        if (section) {
          section.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      // ==================== SEGUIR USUARIOS ====================
      async function handleFollowClick(event, targetUserId) {
        event.preventDefault();
        event.stopPropagation();

        const btn = event.currentTarget;
        const currentUser = Parse.User.current();

        if (!currentUser) {
          showToast("⚠️ Debes iniciar sesión para seguir usuarios");
          return;
        }

        if (currentUser.id === targetUserId) return; // No seguirse a sí mismo

        // Estado loading
        btn.classList.add("loading");
        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳";

        try {
          const result = await toggleFollow(targetUserId);

          if (result.ok) {
            // Actualizar estado local
            if (result.siguiendo) {
              followingSet.add(targetUserId);
              btn.classList.add("following");
              btn.innerHTML = "✓ Siguiendo";
              showToast("✅ Ahora sigues a este usuario");
            } else {
              followingSet.delete(targetUserId);
              btn.classList.remove("following");
              btn.innerHTML = "+ Seguir";
              showToast("❌ Dejaste de seguir");
            }

            // Actualizar contador de seguidores en tiempo real
            const followersEl = document.getElementById(
              `followers-${targetUserId}`,
            );
            if (followersEl) {
              const current = parseInt(followersEl.textContent) || 0;
              followersEl.textContent = result.siguiendo
                ? current + 1
                : current - 1;
            }
          } else {
            showToast("❌ " + (result.error || "Error al seguir"));
            btn.innerHTML = originalText;
          }
        } catch (err) {
          console.error("Error en follow:", err);
          showToast("❌ Error de conexión");
          btn.innerHTML = originalText;
        } finally {
          btn.classList.remove("loading");
          btn.disabled = false;
        }
      }

      // ==================== EVENT LISTENERS ====================
      document.getElementById("rol-filters").addEventListener("click", (e) => {
        if (e.target.classList.contains("filter-chip")) {
          document
            .querySelectorAll(".filter-chip")
            .forEach((c) => c.classList.remove("active"));
          e.target.classList.add("active");
          activeRol = e.target.dataset.rol;
          applyProfileFiltersAndRender();
          renderReviews();
        }
      });

      let searchTimer;
      document.getElementById("search-users").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          searchQuery = e.target.value;
          applyProfileFiltersAndRender();
        }, 300);
      });

      // Paginación
      document
        .getElementById("prev-page")
        .addEventListener("click", () => changePage(-1));
      document
        .getElementById("next-page")
        .addEventListener("click", () => changePage(1));

      // Inicialización
      document.addEventListener("DOMContentLoaded", loadComunidad);
    </script>
  </body>
</html>
