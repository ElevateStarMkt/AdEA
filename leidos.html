<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico" />
    <title>Libros Leídos - AdEA</title>
    <meta
      name="description"
      content="Consulta la biblioteca completa de libros leídos por un usuario en AdEA."
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      .leidos-hero {
        padding: 140px 0 60px;
      }
      .leidos-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .leidos-avatar {
        width: 0px;
        height: 0px;
        border-radius: 50%;
        background: var(--red);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .leidos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 24px;
        margin-top: 24px;
      }
      .leido-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
        transition: all var(--transition);
        text-decoration: none;
        color: inherit;
      }
      .leido-card:hover {
        border-color: var(--red);
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .leido-card__cover {
        aspect-ratio: 2/3;
        background: var(--bg3);
        overflow: hidden;
        position: relative;
      }
      .leido-card__cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease;
      }
      .leido-card:hover .leido-card__cover img {
        transform: scale(1.05);
      }
      .leido-card__info {
        padding: 12px;
      }
      .leido-card__title {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--text);
      }
      .leido-card__author {
        font-size: 0.8rem;
        color: var(--text-muted);
      }
      .loading-state,
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
        grid-column: 1 / -1;
      }
      @media (max-width: 600px) {
        .leidos-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 16px;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>
    <section class="leidos-hero">
      <div class="container">
        <div class="leidos-header">
          <div class="leidos-avatar" id="leidos-avatar">?</div>
          <div>
            <h1
              style="
                margin: 0;
                font-family: var(--font-serif);
                font-size: clamp(1.5rem, 4vw, 2.2rem);
              "
            >
              Libros leídos por <span id="leidos-user-name">usuario</span>
            </h1>
            <p style="margin: 4px 0 0; color: var(--text-muted)">
              Biblioteca completa de lecturas registradas.
            </p>
          </div>
        </div>
        <div class="leidos-grid" id="leidos-grid">
          <div class="loading-state">Cargando libros...</div>
        </div>
      </div>
    </section>
    <div id="footer-placeholder"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script>
      injectShell("");

      async function loadLeidos() {
        const params = new URLSearchParams(location.search);
        const targetUserId = params.get("id");
        const grid = document.getElementById("leidos-grid");

        if (!targetUserId) {
          grid.innerHTML = `<div class="empty-state"><p>Usuario no especificado. <a href="catalogo.html" class="btn btn-secondary" style="margin-top:16px">Ir al catálogo</a></p></div>`;
          return;
        }

        // Cargar perfil para mostrar nombre/avatar
        try {
          const perfil = await getPerfilPublico(targetUserId);
          if (perfil) {
            document.getElementById("leidos-avatar").textContent = (
              perfil.nombre || "U"
            )
              .charAt(0)
              .toUpperCase();
            document.getElementById("leidos-user-name").textContent =
              perfil.nombre || "Usuario";
            document.title = `Libros Leídos por ${perfil.nombre} - AdEA`;
          }
        } catch (e) {
          document.getElementById("leidos-user-name").textContent = "usuario";
        }

        try {
          let leidos = [];
          const currentUser = Parse.User.current();
          const isOwnProfile = currentUser && currentUser.id === targetUserId;

          // ✅ 1. Intentar Cloud Function (para perfiles públicos)
          try {
            leidos = await Parse.Cloud.run("getPublicLeidos", {
              userId: targetUserId,
            });
          } catch (cloudErr) {
            console.log("Cloud Function no disponible, intentando fallback...");

            // ✅ 2. Fallback: si es tu propio perfil, consulta directa SÍ funciona
            if (isOwnProfile) {
              const Leido = Parse.Object.extend("Leidos");
              const q = new Parse.Query(Leido);
              q.equalTo("usuario", {
                __type: "Pointer",
                className: "_User",
                objectId: targetUserId,
              });
              q.descending("createdAt");
              q.limit(500);
              leidos = await q.find();
            } else {
              // ✅ 3. Si no es tu perfil y no hay Cloud Function, mostrar mensaje
              grid.innerHTML = `<div class="empty-state">
          <p style="margin-bottom:16px">Los libros leídos de otros usuarios son privados.</p>
          ${currentUser ? `<a href="perfil.html?id=${targetUserId}" class="btn btn-secondary">Volver al perfil</a>` : `<a href="auth.html" class="btn btn-primary">Inicia sesión para ver tus libros</a>`}
        </div>`;
              return;
            }
          }

          // Si no hay libros
          if (!leidos || leidos.length === 0) {
            grid.innerHTML = `<div class="empty-state"><p>Este usuario aún no ha marcado libros como leídos.</p></div>`;
            return;
          }

          // Extraer IDs de libros y cargar datos
          const libroIds = [
            ...new Set(
              leidos
                .map((l) => l.libroId || l.get?.("libroId"))
                .filter(Boolean),
            ),
          ];
          const libroMap = {};

          if (libroIds.length > 0) {
            const Book = Parse.Object.extend("Books");
            const bq = new Parse.Query(Book);
            bq.containedIn("libroId", libroIds);
            bq.limit(200);
            const books = await bq.find();
            books.forEach((b) => {
              libroMap[b.get("libroId")] = b;
            });
          }

          // Renderizar grid
          grid.innerHTML =
            leidos
              .map((l) => {
                const libroId = l.libroId || l.get?.("libroId");
                const book = libroMap[libroId];
                if (!book) return "";

                const titulo = book.get("titulo") || "Sin título";
                const autor = book.get("autor") || "";
                const imagen =
                  book.get("imagen") || "assets/img/cover-placeholder.svg";

                return `<a href="libro.html?id=${libroId}" class="leido-card">
        <div class="leido-card__cover">
          <img src="${imagen}" alt="${titulo}" onerror="this.src='assets/img/cover-placeholder.svg'">
        </div>
        <div class="leido-card__info">
          <div class="leido-card__title">${titulo}</div>
          <div class="leido-card__author">${autor}</div>
        </div>
      </a>`;
              })
              .filter(Boolean)
              .join("") ||
            `<div class="empty-state"><p>No se pudieron cargar los detalles de los libros.</p></div>`;
        } catch (err) {
          console.error("❌ Error en loadLeidos:", err);
          grid.innerHTML = `<div class="empty-state" style="color:#f87171"><p>Error al cargar los libros leídos.</p><small style="display:block;margin-top:8px">${err.message || ""}</small></div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", loadLeidos);
    </script>
  </body>
</html>
