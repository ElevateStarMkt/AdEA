<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/AdEA/favicon.ico" />
    <title>Reseñas de usuario - AdEA</title>
    <meta
      name="description"
      content="Consulta todas las reseñas escritas por un usuario en AdEA."
    />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <style>
      .resenas-hero {
        padding: 140px 0 60px;
      }
      .resenas-header {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 24px;
        flex-wrap: wrap;
      }
      .resenas-avatar {
        width: 0px;
        height: 0px;
        border-radius: 50%;
        background: var(--red);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .resenas-grid {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 24px;
      }
      .resena-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 20px 24px;
        transition: border-color var(--transition);
        text-decoration: none;
        color: inherit;
        display: block;
      }
      .resena-card:hover {
        border-color: var(--red);
      }
      .resena-card__header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 12px;
      }
      .resena-card__book {
        font-family: var(--font-serif);
        font-size: 1rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 4px;
      }
      .resena-card__author {
        font-size: 0.85rem;
        color: var(--text-muted);
      }
      .resena-card__stars {
        color: var(--gold);
        font-size: 1.1rem;
        letter-spacing: 1px;
      }
      .resena-card__mood {
        font-size: 0.75rem;
        padding: 3px 10px;
        background: var(--surface);
        border-radius: 12px;
        color: var(--text-muted);
      }
      .resena-card__text {
        font-size: 0.95rem;
        color: var(--text-muted);
        line-height: 1.7;
        margin-bottom: 12px;
        text-align: justify;
      }
      .resena-card__tag {
        display: inline-block;
        background: var(--surface);
        padding: 4px 12px;
        border-radius: 16px;
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
      }
      .resena-card__date {
        font-size: 0.75rem;
        color: var(--text-dim);
        margin-top: 8px;
      }
      .loading-state,
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
      }
      @media (max-width: 600px) {
        .resenas-header {
          flex-direction: column;
          align-items: flex-start;
        }
        .resena-card__header {
          flex-direction: column;
          gap: 8px;
        }
      }
    </style>
  </head>
  <body class="noise-bg">
    <div id="nav-placeholder"></div>
    <section class="resenas-hero">
      <div class="container">
        <div class="resenas-header">
          <div class="resenas-avatar" id="resenas-avatar">?</div>
          <div>
            <h1
              style="
                margin: 0;
                font-family: var(--font-serif);
                font-size: clamp(1.5rem, 4vw, 2.2rem);
              "
            >
              Reseñas de <span id="resenas-user-name">usuario</span>
            </h1>
            <p style="margin: 4px 0 0; color: var(--text-muted)">
              Todas las opiniones escritas por este lector.
            </p>
          </div>
        </div>
        <div class="resenas-grid" id="resenas-grid">
          <div class="loading-state">Cargando reseñas...</div>
        </div>
      </div>
    </section>
    <div id="footer-placeholder"></div>

    <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
    <script src="js/backend.js"></script>
    <script src="js/components.js"></script>
    <script src="js/utils.js"></script>
    <script>
      injectShell("");

      async function loadResenas() {
        const params = new URLSearchParams(location.search);
        const userId = params.get("id");
        const grid = document.getElementById("resenas-grid");

        if (!userId) {
          grid.innerHTML = `<div class="empty-state"><p>Usuario no especificado. <a href="catalogo.html" class="btn btn-secondary" style="margin-top:16px">Ir al catálogo</a></p></div>`;
          return;
        }

        // Cargar perfil para mostrar nombre/avatar
        try {
          const perfil = await getPerfilPublico(userId);
          if (perfil) {
            document.getElementById("resenas-avatar").textContent = (
              perfil.nombre || "U"
            )
              .charAt(0)
              .toUpperCase();
            document.getElementById("resenas-user-name").textContent =
              perfil.nombre || "Usuario";
            document.title = `Reseñas de ${perfil.nombre} - AdEA`;
          }
        } catch (e) {
          document.getElementById("resenas-user-name").textContent = "usuario";
        }

        try {
          // Cargar reseñas del usuario
          const Resena = Parse.Object.extend("Resenas");
          const q = new Parse.Query(Resena);
          q.equalTo("usuarioId", userId);
          q.descending("createdAt");
          q.limit(200);
          q.include("usuario");
          const reseñas = await q.find();

          if (!reseñas || reseñas.length === 0) {
            grid.innerHTML = `<div class="empty-state"><p>Este usuario aún no ha escrito reseñas.</p></div>`;
            return;
          }

          // Cargar datos de los libros para mostrar título/autor
          const libroIds = [
            ...new Set(reseñas.map((r) => r.get("libroId")).filter(Boolean)),
          ];
          const libroMap = {};
          if (libroIds.length > 0) {
            const Book = Parse.Object.extend("Books");
            const bq = new Parse.Query(Book);
            bq.containedIn("libroId", libroIds);
            bq.limit(200);
            const books = await bq.find();
            books.forEach((b) => {
              libroMap[b.get("libroId")] = b;
            });
          }

          // Renderizar lista
          grid.innerHTML = reseñas
            .map((r) => {
              const libroId = r.get("libroId");
              const book = libroMap[libroId];
              const titulo = book?.get("titulo") || "Libro no disponible";
              const autor = book?.get("autor") || "";
              const estrellas = r.get("estrellas") || 0;
              const texto = r.get("texto") || "";
              const mood = r.get("mood") || "";
              const etiqueta = r.get("etiqueta") || "";
              const fecha =
                r
                  .get("createdAt")
                  ?.toLocaleDateString("es-ES", {
                    day: "numeric",
                    month: "short",
                    year: "numeric",
                  }) || "";

              const starsHTML =
                "★".repeat(Math.floor(estrellas)) +
                (estrellas % 1 >= 0.5 ? "½" : "") +
                "☆".repeat(5 - Math.ceil(estrellas));

              return `<a href="libro.html?id=${libroId}" class="resena-card">
        <div class="resena-card__header">
          <div>
            <div class="resena-card__book">${titulo}</div>
            <div class="resena-card__author">${autor}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="resena-card__stars">${starsHTML}</span>
            ${mood ? `<span class="resena-card__mood">${mood}</span>` : ""}
          </div>
        </div>
        <p class="resena-card__text">"${texto}"</p>
        ${etiqueta ? `<span class="resena-card__tag">${etiqueta}</span>` : ""}
        <div class="resena-card__date">${fecha}</div>
      </a>`;
            })
            .join("");
        } catch (err) {
          console.error("❌ Error en loadResenas:", err);
          grid.innerHTML = `<div class="empty-state" style="color:#f87171"><p>Error al cargar las reseñas.</p><small style="display:block;margin-top:8px">${err.message || ""}</small></div>`;
        }
      }

      document.addEventListener("DOMContentLoaded", loadResenas);
    </script>
  </body>
</html>
